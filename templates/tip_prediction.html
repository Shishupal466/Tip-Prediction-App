{% include "header.html" %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2 class="text-center">💰 Restaurant Tip Predictor</h2>

<form method="POST">

{% csrf_token %}

<div class="row">

<div class="col-md-6">

<label>Total Bill (300 - 6000)</label>
<input type="number" name="total_bill" min="300" max="6000" step="100" class="form-control" >

</div>

<div class="col-md-6">

<label>Group Size</label>
<input type="number" name="size" min="1" max="6" step="1" class="form-control">

</div>

<div class="col-md-6 mt-3">

<label>Gender</label>

<select name="sex" class="form-control">

<option>Male</option>
<option>Female</option>

</select>

</div>

<div class="col-md-6 mt-3">

<label>Smoker</label>

<select name="smoker" class="form-control">

<option>Yes</option>
<option>No</option>

</select>

</div>

<div class="col-md-6 mt-3">

<label>Day</label>

<select name="day" class="form-control">

<option>Thur</option>
<option>Fri</option>
<option>Sat</option>
<option>Sun</option>

</select>

</div>

<div class="col-md-6 mt-3">

<label>Time</label>

<select name="time" class="form-control">

<option>Lunch</option>
<option>Dinner</option>

</select>

</div>

</div>

<br>

<button class="btn btn-success">Predict Tip</button>

</form>

{% if prediction %}

<div class="alert alert-success mt-4">

<h3>Estimated Tip: ₹{{ prediction|floatformat:2 }}</h3>

</div>

<div class="alert alert-danger mt-4">

<h3>Prediction value may be vary due to data shortage.</h3>

</div>

{% endif %}

</div>

{% include "footer.html" %}
